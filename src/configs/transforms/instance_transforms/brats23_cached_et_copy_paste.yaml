train:
  _target_: monai.transforms.Compose
  transforms:
    - _target_: monai.transforms.EnsureTyped
      keys: ["image", "label"]
      track_meta: false
    - _target_: src.transforms.RandETFocusedCropd
      keys: ["image", "label"]
      roi_size: [96, 96, 96]
      label_key: "label"
      et_channel: 2
      wt_channel: 1
      et_focus_prob: 0.7
      random_prob: 0.33
    - _target_: src.transforms.RandETCopyPasted
      keys: ["image", "label"]
      donor_bank_path: "${oc.env:ET_DONOR_BANK,pretrained/et_copy_paste/et_donor_bank.pt}"
      prob: 0.25
      max_insertions: 2
      second_insertion_prob: 0.35
      scale_range: [0.6, 0.9]
      flip_prob: 0.5
      rot90_prob: 0.5
      small_donor_bias: 1.0
      min_insert_voxels: 24
      min_distance_to_tumor: 6
      blend_band_width: 3
      blend_smooth_steps: 1
      intensity_match: true
      max_position_trials: 16
    - _target_: monai.transforms.RandFlipd
      keys: ["image", "label"]
      prob: 0.5
      spatial_axis: 0
    - _target_: monai.transforms.RandFlipd
      keys: ["image", "label"]
      prob: 0.5
      spatial_axis: 1
    - _target_: monai.transforms.RandFlipd
      keys: ["image", "label"]
      prob: 0.5
      spatial_axis: 2
    - _target_: monai.transforms.RandAffined
      keys: ["image", "label"]
      mode: ["bilinear", "nearest"]
      prob: 0.2
      rotate_range: [0.5236, 0.5236, 0.5236]
      scale_range: [0.3, 0.3, 0.3]
      padding_mode: "zeros"
    - _target_: monai.transforms.RandGaussianNoised
      keys: ["image"]
      prob: 0.1
      mean: 0.0
      std: 0.1
    - _target_: monai.transforms.RandGaussianSmoothd
      keys: ["image"]
      prob: 0.2
      sigma_x: [0.5, 1.15]
      sigma_y: [0.5, 1.15]
      sigma_z: [0.5, 1.15]
    - _target_: monai.transforms.RandScaleIntensityd
      keys: ["image"]
      factors: 0.25
      prob: 0.15
    - _target_: monai.transforms.RandShiftIntensityd
      keys: ["image"]
      offsets: 0.1
      prob: 0.1
    - _target_: monai.transforms.RandAdjustContrastd
      keys: ["image"]
      prob: 0.15
      gamma: [0.7, 1.5]
    - _target_: monai.transforms.EnsureTyped
      keys: ["image", "label"]
      track_meta: false

inference:
  _target_: monai.transforms.Compose
  transforms:
    - _target_: monai.transforms.EnsureTyped
      keys: ["image", "label"]
      track_meta: false
