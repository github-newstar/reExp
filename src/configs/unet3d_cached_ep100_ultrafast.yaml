defaults:
  - brats23_swin_unetr_cached
  - _self_

model:
  _delete_: true
  _target_: src.model.UNet3D
  in_channels: 4
  out_channels: 3
  channels: [32, 64, 128, 256, 512]
  strides: [2, 2, 2, 2]
  num_res_units: 0

writer:
  run_name: unet3d_cached_ep100_ultrafast_3_2_lastfull_v1_0222

datasets:
  train:
    usage_ratio: 1.0
  val:
    usage_ratio: 1.0

dataloader:
  batch_size: 2

trainer:
  n_epochs: 100
  max_grad_norm: 3.0
  eval_partitions: ["val"]
  warmup:
    enabled: true
    epochs: 10
  validation_policy:
    enabled: true
    default_mode: quick
    always_eval_epoch1: true
    phases:
      - max_epoch_ratio: 0.5
        interval: 3
        mode: quick
      - max_epoch_ratio: 1.0
        interval: 2
        mode: quick
    full_eval:
      enabled: true
      interval: 0
      epochs: [100]
    post_training_full_eval:
      enabled: true
      top_k: 3
      report_best_only: true
