defaults:
  - brats23_swin_unetr_cached
  - override model: liunet_lfsde
  - _self_

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-4
  weight_decay: 1e-5

lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${trainer.n_epochs}
  eta_min: 1e-5

loss_function:
  _target_: src.loss.DiceFocalSegLoss
  dice_weight: 1.0
  focal_weight: 1.0
  gamma: 2.0
  alpha: null
  deep_supervision: false

writer:
  run_name: liunet_lfsde_ep100_bs2_warm10_lr1e4_to_1e5_fullval_10_5_2

datasets:
  train:
    cache_dir: "${oc.env:CACHE_DIR,/root/autodl-tmp/cached}"
    split_strategy: "three_way"
    val_ratio: 0.1
    test_ratio: 0.2
  val:
    cache_dir: "${oc.env:CACHE_DIR,/root/autodl-tmp/cached}"
    split_strategy: "three_way"
    val_ratio: 0.1
    test_ratio: 0.2
  test:
    cache_dir: "${oc.env:CACHE_DIR,/root/autodl-tmp/cached}"
    split_strategy: "three_way"
    val_ratio: 0.1
    test_ratio: 0.2

dataloader:
  batch_size: 2
  num_workers: 16

trainer:
  n_epochs: 100
  max_grad_norm: 1.0
  lr_scheduler_step_per: epoch
  warmup:
    enabled: true
    epochs: 10
    start_factor: 0.1
    end_factor: 1.0
  validation_policy:
    enabled: true
    default_mode: full
    always_eval_epoch1: false
    phases:
      - max_epoch_ratio: 0.5
        interval: 10
        mode: full
      - max_epoch_ratio: 0.8
        interval: 5
        mode: full
      - max_epoch_ratio: 1.0
        interval: 2
        mode: full
    full_eval:
      enabled: false
      interval: 0
      epochs: []
    post_training_full_eval:
      enabled: true
      top_k: 1
      metric: "val_MeanDice"
      mode: max
      source_modes: ["full"]
      partitions: ["test"]
      use_best_model_checkpoint: true
      report_best_only: true
      save_summary_path: "post_full_eval_summary_hd95_test.json"
      extra_inference_metrics:
        - _target_: src.metrics.MeanHD95Metric
          name: "HD95_Mean"
          threshold: 0.5
          apply_sigmoid: true
          include_background: true
          directed: false
          empty_fallback: 0.0
        - _target_: src.metrics.ChannelHD95Metric
          name: "HD95_TC"
          channel_index: 0
          threshold: 0.5
          apply_sigmoid: true
          include_background: true
          directed: false
          empty_fallback: 0.0
        - _target_: src.metrics.ChannelHD95Metric
          name: "HD95_WT"
          channel_index: 1
          threshold: 0.5
          apply_sigmoid: true
          include_background: true
          directed: false
          empty_fallback: 0.0
        - _target_: src.metrics.ChannelHD95Metric
          name: "HD95_ET"
          channel_index: 2
          threshold: 0.5
          apply_sigmoid: true
          include_background: true
          directed: false
          empty_fallback: 0.0
  use_sliding_window_inference: true
  sw_roi_size: [96, 96, 96]
  sw_batch_size: 1
