defaults:
  - brats23_swin_unetr_cached
  - override model: unet3d_full_dualband_fsde_skip4_boundary
  - _self_

loss_function:
  _target_: src.loss.DiceFocalSegLossWithBoundary
  dice_weight: 1.0
  focal_weight: 1.0
  gamma: 2.0
  alpha: null
  deep_supervision: true
  deep_supervision_weights: [0.5, 0.25]
  boundary_loss_weight: 0.03
  boundary_bce_weight: 1.0
  boundary_dice_weight: 1.0
  boundary_bce_pos_weight: 3.0
  boundary_radius: 1
  boundary_channel_index: 2
  boundary_start_epoch: 51

optimizer:
  lr: 1e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${trainer.n_epochs}
  eta_min: 1e-5

writer:
  run_name: unet3d_fsde_skip4_boundary_ep100_bs2_fullval_10_5_2_split701020
  loss_names: [
    "loss",
    "loss_dice",
    "loss_focal",
    "loss_ds",
    "loss_boundary",
    "loss_boundary_bce",
    "loss_boundary_dice",
  ]

datasets:
  train:
    usage_ratio: 1.0
    split_strategy: "three_way"
    val_ratio: 0.1
    test_ratio: 0.2
  val:
    usage_ratio: 1.0
    split_strategy: "three_way"
    val_ratio: 0.1
    test_ratio: 0.2
  test:
    usage_ratio: 1.0
    split_strategy: "three_way"
    val_ratio: 0.1
    test_ratio: 0.2

dataloader:
  batch_size: 2
  num_workers: 16

trainer:
  n_epochs: 100
  max_grad_norm: 1.0
  eval_partitions: ["val"]
  warmup:
    enabled: true
    epochs: 10
    start_factor: 0.1
    end_factor: 1.0
  validation_policy:
    enabled: true
    default_mode: full
    always_eval_epoch1: false
    phases:
      - max_epoch_ratio: 0.5
        interval: 10
        mode: full
      - max_epoch_ratio: 0.8
        interval: 5
        mode: full
      - max_epoch_ratio: 1.0
        interval: 2
        mode: full
    full_eval:
      enabled: false
      interval: 0
      epochs: []
    post_training_full_eval:
      enabled: false
